<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Argus</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">
  <aside id="panel" aria-label="Daftar job">
    <header><strong>Argus</strong><button id="close-panel" type="button" aria-label="Tutup daftar">×</button></header>
    <div id="filters" role="group" aria-label="Saring job">
      <button type="button" data-filter="all" aria-pressed="true">Semua</button>
      <button type="button" data-filter="waiting" aria-pressed="false">Menunggu</button>
      <button type="button" data-filter="research" aria-pressed="false">Riset</button>
    </div>
    <ul id="threads"></ul>
    <p id="skipped" class="muted"></p>
    <footer id="panel-foot">
      <a id="viewer-link" class="plain" href="http://localhost:8710/" rel="noopener noreferrer">Buka viewer (baca saja)</a>
    </footer>
  </aside>
  <main>
    <header class="bar">
      <button id="open-panel" type="button" aria-label="Buka daftar">☰</button>
      <strong class="brand">Argus</strong>
      <span id="summary" class="muted">memuat…</span>
    </header>
    <section id="stream"></section>
    <div id="slot" role="status" aria-live="polite"></div>
    <div id="dock">
      <div id="chips" role="group" aria-label="Mode obrolan">
        <button type="button" data-mode="status" aria-pressed="true">Status</button>
        <button type="button" data-mode="issue" aria-pressed="false">Issue</button>
        <button type="button" data-mode="prd" aria-pressed="false">PRD</button>
        <button type="button" data-mode="research" aria-pressed="false">Riset</button>
      </div>
      <form id="issue-form" hidden autocomplete="off">
        <select id="repo" aria-label="Repositori"></select>
        <textarea id="message" rows="3" maxlength="6000" placeholder="Tulis pesan" aria-label="Pesan"></textarea>
        <button id="prepare" type="submit">Siapkan issue baru</button>
      </form>
      <form id="composer" autocomplete="off">
        <input id="query" type="text" maxlength="200" placeholder="Cari job: id, status, judul" aria-label="Cari job">
      </form>
    </div>
    <nav id="tabs" aria-label="Navigasi utama">
      <button type="button" data-tab="chat" aria-pressed="true">Obrolan<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></button>
      <button type="button" data-tab="cards" aria-pressed="false">Antrean<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
      <button type="button" data-tab="decide" aria-pressed="false">Keputusan<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg><span id="decide-badge" class="badge" hidden></span></button>
      <button type="button" data-tab="cost" aria-pressed="false">Biaya<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></button>
    </nav>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
