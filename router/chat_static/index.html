<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Argus</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">
  <aside id="panel" aria-label="Daftar job">
    <header><strong>Argus</strong><button id="close-panel" type="button" aria-label="Tutup daftar">×</button></header>
    <ul id="threads"></ul>
    <p id="skipped" class="muted"></p>
  </aside>
  <main>
    <header class="bar">
      <button id="open-panel" type="button" aria-label="Buka daftar">☰</button>
      <span id="summary" class="muted">memuat…</span>
    </header>
    <section id="stream"></section>
    <div id="slot" role="status" aria-live="polite"></div>
    <div id="dock">
      <div id="chips" role="group" aria-label="Mode">
        <button type="button" data-mode="status" aria-pressed="true">Status</button>
        <button type="button" data-mode="issue" aria-pressed="false">Issue</button>
        <button type="button" data-mode="prd" aria-pressed="false">PRD</button>
        <button type="button" data-mode="research" aria-pressed="false">Riset</button>
        <button type="button" data-mode="decide" aria-pressed="false">Keputusan</button>
        <button type="button" data-mode="cards" aria-pressed="false">Kartu</button>
      </div>
      <form id="issue-form" hidden autocomplete="off">
        <select id="repo" aria-label="Repositori"></select>
        <textarea id="message" rows="3" maxlength="6000" placeholder="Tulis pesan" aria-label="Pesan"></textarea>
        <button id="prepare" type="submit">Siapkan issue baru</button>
      </form>
      <form id="composer" autocomplete="off">
        <input id="query" type="text" maxlength="200" placeholder="Cari job: id, status, judul" aria-label="Cari job">
      </form>
    </div>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
