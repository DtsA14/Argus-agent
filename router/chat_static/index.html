<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Argus</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">
  <div id="scrim" hidden></div>
  <aside id="panel" aria-label="Job list">
    <header><strong>Argus</strong><button id="close-panel" class="round" type="button" aria-label="Close list">×</button></header>
    <button id="new-request-panel" class="cta" type="button">New request</button>
    <div id="topics-block" hidden>
      <h2 class="sec-title">Topics</h2>
      <ul id="topics"></ul>
      <button id="new-topic" class="cta" type="button">New topic</button>
    </div>
    <h2 class="sec-title">All jobs</h2>
    <form id="composer" autocomplete="off">
      <input id="query" type="text" maxlength="200" placeholder="Search jobs: id, status, title" aria-label="Search jobs">
    </form>
    <div id="filters" role="group" aria-label="Filter jobs">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="waiting" aria-pressed="false" aria-label="Awaiting decision">Waiting</button>
      <button type="button" data-filter="research" aria-pressed="false">Research</button>
    </div>
    <ul id="threads"></ul>
    <p id="skipped" class="muted"></p>
    <footer id="panel-foot">
      <p id="panel-cost" class="muted"></p>
      <a id="viewer-link" class="plain" href="http://localhost:8710/" rel="noopener noreferrer">Open viewer (read-only)</a>
    </footer>
  </aside>
  <main>
    <header class="bar">
      <button id="open-panel" class="round" type="button" aria-label="Open list">☰</button>
      <div class="titles"><strong class="brand">Argus</strong><span id="summary" class="muted">loading…</span><span id="budget-chip" class="muted" hidden></span></div>
      <button id="more" class="round" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="More">⋯</button>
      <div id="more-menu" role="menu" aria-label="More" hidden>
        <button id="refresh" type="button" role="menuitem">Refresh</button>
        <a class="plain" role="menuitem" href="http://localhost:8710/" rel="noopener noreferrer">Open viewer (read-only)</a>
      </div>
    </header>
    <section id="stream"></section>
    <div id="slot" role="status" aria-live="polite"></div>
    <div id="dock" hidden>
      <div id="plus-menu" role="menu" aria-label="Request type" hidden>
        <button type="button" role="menuitem" data-mode="manager">Foreman</button>
        <button type="button" role="menuitem" data-mode="issue">New issue</button>
        <button type="button" role="menuitem" id="plus-more" aria-expanded="false">More types…</button>
        <button type="button" role="menuitem" data-mode="prd" class="more-type" hidden>PRD</button>
        <button type="button" role="menuitem" data-mode="research" class="more-type" hidden>Research</button>
      </div>
      <div id="box">
        <button id="plus" class="round" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Choose the request type">+</button>
        <form id="issue-form" hidden autocomplete="off">
          <div id="typebar"><span id="type-label"></span><select id="repo" aria-label="Repository"></select></div>
          <textarea id="message" rows="1" maxlength="6000" placeholder="Write a message" aria-label="Message"></textarea>
          <button id="prepare" type="submit" aria-label="Prepare new issue">↑</button>
        </form>
      </div>
    </div>
    <nav id="tabs" aria-label="Main navigation">
      <button type="button" data-tab="chat" aria-pressed="true">Chat<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></button>
      <button type="button" data-tab="cards" aria-pressed="false">Queue<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
      <button type="button" data-tab="decide" aria-pressed="false">Decisions<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg><span id="decide-badge" class="badge" hidden></span></button>
      <button type="button" data-tab="cost" aria-pressed="false">Cost<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></button>
    </nav>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
