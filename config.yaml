budget:
  max_iterations: 5
  max_tokens: 200000     # hard limit: an iteration only starts if its worst-case cost fits
  max_seconds: 600       # soft limit: summed node time, checked between iterations
  stagnation_rounds: 2   # stop if the evaluator score has not improved for N rounds
  max_workers: 3         # an orchestrator plan with more parallel tasks is rejected
  max_usd: 0.50          # hard limit, reserved like tokens: an iteration starts only if its worst case fits
  allow_unpriced: false  # refuse models that have no entry in 'prices' (their cost could not be capped)

# Node implementations. fake = deterministic stand-in (no model calls); llm = real model via harness/llm.py.
# Milestone 2 turns these on phase by phase; override per run with  --impl orchestrator=llm
impl:
  orchestrator: fake
  worker: fake
  synthesize: fake
  evaluator: fake       # llm: adds the phase-3c judge (role evaluator) after the programmatic checks

orchestrator:
  plan_attempts: 3       # model calls allowed to produce a valid plan (1 + 2 retries with the errors)
  # Require the SubmitPlan tool call via tool_choice. Off: claude-sonnet-5-5, claude-opus-5-5 and
  # claude-fable-5-1 reject a forced tool_choice with HTTP 400. Unforced, a reply without exactly one
  # SubmitPlan call is returned to the model as an invalid plan (counts against plan_attempts).
  force_tool: false

# Which nodes call which role's model. Nodes not listed make no model calls (cost 0 USD).
node_roles:
  orchestrator: orchestrator
  worker: worker
# Only for a node running a real model (impl: llm): its fake makes no model call, so it costs nothing.
llm_node_roles:
  synthesize: writer
  evaluator: evaluator

# Phase 3b: the writer fills in the recommendations; every number must match a referenced fact
# (docs/MILESTONE3_PLAN.md 3.6). attempts: model calls allowed to produce valid recommendations.
synthesize:
  attempts: 3

# Phase 3c: the rubric judge. attempts: model calls allowed to produce a usable verdict; after that the rubric
# fails (fail closed). A cut-off reply is never retried.
judge:
  attempts: 2

# The LLM wrapper (harness/llm.py). Each request's max_tokens is derived from what is left of the
# node's reservation; a request that cannot fit min_output_tokens is refused before it is sent.
llm:
  attempts: 3                       # transient errors (429, 5xx, timeouts) are retried, others are not
  base_delay: 1.0                   # seconds; exponential with jitter, Retry-After wins when present
  min_output_tokens: 64
  input_margin: 1.2                 # safety factor on heuristic input counts (Anthropic counts exactly)
  failed_attempt_charge: worst_case # a failed attempt is charged input + max_tokens, since it may be billed

logging:
  prompts: hashed        # hashed | full. "full" also needs ARGUS_DEV=1 and is meant for synthetic data only

# Worst-case tokens per node call. Used to reserve budget before an iteration starts;
# a node that reports more than its estimate is a harness error (EstimateExceeded).
# With real LLMs, set each call's max_tokens so input + output stays under these.
token_estimates:
  orchestrator: 3000
  worker: 2000
  synthesize: 1000
  evaluator: 1500

# Worst-case tokens for a node that runs a real model (impl: llm); replaces token_estimates for that node
# in node reservations, the iteration reservation and the USD estimates alike. Starting point from the
# first 2e smoke ledger: the worker's second step alone needed ~1,650 input tokens (2,000 was too small),
# and a revised plan used 2,095 input and was cut off at 905 output tokens (3,000 was too small).
# With 3 workers: 12,000 + 3 x 12,000 + 1,000 + 1,500 = 50,500 tokens per iteration.
llm_token_estimates:
  orchestrator: 12000
  worker: 12000
  synthesize: 8000       # 3b starting point (prompt ~1,500 + up to 3 attempts); corrected from the ledger
  evaluator: 14000       # 3c starting point (prompt ~2,500 + 4,096 output incl. thinking, x2 attempts)

retry:
  attempts: 3
  base_delay: 0.05       # seconds, doubles each attempt

# Tool allowlist per role (enforced by the harness, not by prompts)
tools:
  orchestrator: [write_file]
  worker: [read_data, run_python]
  evaluator: []

# ---------------------------------------------------------------------------
# LLM providers. Adding a provider = adding an entry here.
# kind: anthropic | openai | deepseek | openai_compatible (any OpenAI-style API, no code needed)
# API keys are read from the environment variable named in api_key_env; never put keys in this file.
# ---------------------------------------------------------------------------
providers:
  anthropic:
    kind: anthropic
    api_key_env: ANTHROPIC_API_KEY
  openai:
    kind: openai
    api_key_env: OPENAI_API_KEY
  deepseek:
    kind: deepseek
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
  fake:                  # scripted model for tests and offline demos (no network, no key)
    kind: fake
    script_env: ARGUS_FAKE_SCRIPT
  # Example: uncomment to add another provider without touching any code
  # together:
  #   kind: openai_compatible
  #   api_key_env: TOGETHER_API_KEY
  #   base_url: https://api.together.xyz/v1

# ---------------------------------------------------------------------------
# Roles: which model plays which role. Swap a model by editing "model" below,
# or per run:  python main.py --model worker=deepseek:deepseek-flash
# max_output_tokens: upper bound per request (the wrapper may set it lower to stay in budget).
# timeout_s: per-request timeout. params: passed straight to the provider's chat class (temperature, ...).
# ---------------------------------------------------------------------------
roles:
  orchestrator:
    model: "anthropic:claude-sonnet-5-5"
    max_output_tokens: 2048
    timeout_s: 60
  worker:
    model: "anthropic:claude-haiku-5-5"
    max_output_tokens: 2048
    timeout_s: 60
    max_steps: 6           # model calls per worker run (impl.worker: llm)
  writer:
    # Phase 3b: writes the recommendations (impl.synthesize: llm). Decision M3-2: Sonnet 5.5.
    model: "anthropic:claude-sonnet-5-5"
    max_output_tokens: 2048
    timeout_s: 60
  evaluator:
    # Phase 3c judge (impl.evaluator: llm). Decision M3-1: DeepSeek V4.1 Flash, a different provider from the
    # writer. Thinking is on by default and counts as output, hence the larger output cap. No forced tool_choice.
    model: "deepseek:deepseek-flash"
    max_output_tokens: 4096
    timeout_s: 90

# ---------------------------------------------------------------------------
# Price catalog, USD per 1M tokens, from public pages checked mid-Oct 2026. Verify before relying on them.
# A missing entry (e.g. OpenAI below) means cost is reported as "n/a" instead of a guess.
# cache_read is the discounted rate for cached input tokens; without it cached tokens are billed as normal input.
# ---------------------------------------------------------------------------
# Anthropic input/output and Sonnet/Opus cache_read re-checked 2026-10-14 against Anthropic's model table.
# Haiku 5.5 bills $0.50/$2.50 for prompts over 100K tokens; that tier is not modelled, which is safe only
# while every node's token estimate stays far below 100K (a reservation then cannot fit such a prompt).
prices:
  "anthropic:claude-haiku-5-5":  {input: 0.10, output: 0.50, cache_read: 0.01}
  "anthropic:claude-sonnet-5-5": {input: 2.00, output: 10.00, cache_read: 0.20}
  "anthropic:claude-opus-5-5":   {input: 4.00, output: 20.00, cache_read: 0.20}
  "deepseek:deepseek-flash":     {input: 0.15, output: 0.60, cache_read: 0.003, peak_multiplier: 2}
  "deepseek:deepseek-v4-pro":    {input: 0.66, output: 1.98, cache_read: 0.022, peak_multiplier: 2}
  "fake:scripted":               {input: 1.00, output: 5.00}   # made-up price so tests exercise USD limits

# DeepSeek charges double during these UTC windows on weekdays (Chinese public holidays are off-peak;
# that exception is not modelled here). 01-04 and 06-10 UTC = 08-11 and 13-17 WIB.
peak_windows:
  deepseek:
    utc_hours: [[1, 4], [6, 10]]
    weekdays_only: true

# Live smoke run: scripts/smoke_live.py, only with ARGUS_LIVE=1. Real money, so: one run, never retried,
# budget.max_usd lowered to max_usd if it is higher, workers one at a time.
smoke:
  max_usd: 0.50
  max_concurrency: 1

# Code execution for LLM workers (RunPython). kind: docker | none. With none, workers get no RunPython.
# The image must be pinned (name@sha256:... or sha256:<image id>); scripts/pin_sandbox_image.sh does it
# on the VM. ARGUS_SANDBOX_IMAGE overrides `image`. There is never an unsandboxed fallback.
sandbox:
  kind: none
  image: null
  memory: 512m           # hard limit, swap disabled; exceeding it kills the code (exit 137)
  cpus: "1"
  pids: 128
  tmpfs_size: 64m
  timeout_s: 60          # wall clock; the container is killed and removed on timeout
  max_output_bytes: 65536            # kept per stream; the rest is drained and discarded (never buffered)
  kill_after_output_bytes: 16777216  # total output after which the container is killed early
  cleanup_timeout_s: 15              # total budget for kill/remove after a timeout; failure is logged
  allow_unpinned: false
