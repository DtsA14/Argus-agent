budget:
  max_iterations: 5
  max_tokens: 200000     # hard limit: an iteration only starts if its worst-case cost fits
  max_seconds: 600       # soft limit: summed node time, checked between iterations
  stagnation_rounds: 2   # stop if the evaluator score has not improved for N rounds
  max_workers: 3         # an orchestrator plan with more parallel tasks is rejected
  max_usd: 0.50          # hard limit, reserved like tokens: an iteration starts only if its worst case fits
  allow_unpriced: false  # refuse models that have no entry in 'prices' (their cost could not be capped)

# Node implementations. fake = deterministic stand-in (no model calls); llm = real model via harness/llm.py.
# Milestone 2 turns these on phase by phase; override per run with  --impl orchestrator=llm
impl:
  orchestrator: fake
  worker: fake
  synthesize: fake
  evaluator: fake       # llm: adds the phase-3c judge (role evaluator) after the programmatic checks

orchestrator:
  plan_attempts: 3       # model calls allowed to produce a valid plan (1 + 2 retries with the errors)
  # Require the SubmitPlan tool call via tool_choice. Off: claude-sonnet-5-5, claude-opus-5-5 and
  # claude-fable-5-1 reject a forced tool_choice with HTTP 400. Unforced, a reply without exactly one
  # SubmitPlan call is returned to the model as an invalid plan (counts against plan_attempts).
  force_tool: false

# Which nodes call which role's model. Nodes not listed make no model calls (cost 0 USD).
node_roles:
  orchestrator: orchestrator
  worker: worker
# Only for a node running a real model (impl: llm): its fake makes no model call, so it costs nothing.
llm_node_roles:
  synthesize: writer
  evaluator: evaluator

# Phase 3b: the writer fills in the recommendations; every number must match a referenced fact
# (docs/MILESTONE3_PLAN.md 3.6). attempts: model calls allowed to produce valid recommendations.
synthesize:
  attempts: 3

# Phase 3c: the rubric judge. attempts: model calls allowed to produce a usable verdict; after that the rubric
# fails (fail closed). A cut-off reply is never retried.
judge:
  attempts: 2

# The LLM wrapper (harness/llm.py). Each request's max_tokens is derived from what is left of the
# node's reservation; a request that cannot fit min_output_tokens is refused before it is sent.
llm:
  attempts: 3                       # transient errors (429, 5xx, timeouts) are retried, others are not
  base_delay: 1.0                   # seconds; exponential with jitter, Retry-After wins when present
  # SPEC_RATE_LIMIT_RETRY (Atha 2026-11-06): a 429 waits 30 s doubling (jitter), at most 120 s (Retry-After too), and
  # has its own number of attempts; a 429 from the gateway is not charged (harness/llm.py)
  rate_limit_delay_s: 30
  rate_limit_max_delay_s: 120
  rate_limit_attempts: 4
  min_output_tokens: 64
  input_margin: 1.2                 # safety factor on heuristic input counts (Anthropic counts exactly)
  # D5: Anthropic prompt caching (markers added only to what is sent; hashes and memo keys unchanged). Off by default,
  # turned on explicitly for a pilot; a role may override it (roles.<role>.prompt_cache). Only ttl 5m; Haiku 5.5 is
  # not cached in D5. While on, every input token is reserved at the dearer of input and 5-minute write: no hit is assumed.
  prompt_cache: {enabled: false, ttl: 5m}
  failed_attempt_charge: worst_case # a failed attempt is charged input + max_tokens, since it may be billed

logging:
  prompts: hashed        # hashed | full. "full" also needs ARGUS_DEV=1 and is meant for synthetic data only

# Worst-case tokens per node call. Used to reserve budget before an iteration starts;
# a node that reports more than its estimate is a harness error (EstimateExceeded).
# With real LLMs, set each call's max_tokens so input + output stays under these.
token_estimates:
  orchestrator: 3000
  worker: 2000
  synthesize: 1000
  evaluator: 1500

# Worst-case tokens for a node that runs a real model (impl: llm); replaces token_estimates for that node
# in node reservations, the iteration reservation and the USD estimates alike. Starting point from the
# first 2e smoke ledger: the worker's second step alone needed ~1,650 input tokens (2,000 was too small),
# and a revised plan used 2,095 input and was cut off at 905 output tokens (3,000 was too small).
# With 3 workers: 12,000 + 3 x 12,000 + 1,000 + 1,500 = 50,500 tokens per iteration.
llm_token_estimates:
  orchestrator: 12000
  worker: 12000
  synthesize: 8000       # 3b starting point (prompt ~1,500 + up to 3 attempts); corrected from the ledger
  evaluator: 20000       # input ~1,200 + 8,192 output, x2 attempts (calibration run #1: input 1,155-1,214)

# General tasks, slice 1 (docs/reviews/ACCEPTANCE_GENERAL.md). Run limits are the stricter of these and the
# contract's limits. attempt_tokens is one attempt's whole reservation (all its steps); an attempt is admitted only if
# the ledger's spend plus this worst case fits budget.max_tokens and the contract's max_usd. Starting point, to be
# corrected from the ledger of the first live run.
code_task:
  role: coder
  attempt_tokens: 30000
  max_steps: 12
  stagnation_rounds: 2     # the same failing criteria this many attempts in a row ends the run (FAILED_ACCEPTANCE)
  # D2: the feedback to the next attempt carries the error lines of each failing validation (from the verdict's
  # output_tail, bounded). false gives the feedback as it was before D2: replays of older runs (replay_3a.py) use it.
  feedback_error_excerpt: true
  # D3 (docs/reviews/DESIGN_AUTO_VALIDATION.md): after a step that changed the workspace, run every validation and show
  # the result to the agent in the same attempt, at most auto_validate_max times per attempt. Off here (verify.sh time,
  # comparable evals); on in a pilot config. Frozen per run at setup, so a resume decides as the run did.
  auto_validate: false
  auto_validate_max: 4
  # docs/reviews/SPEC_AGENT_CONTEXT_RETRY.md 2.2: once per attempt, when the next call's estimated input is past this
  # share of max_input_tokens and nothing was written yet, the agent is told to write now. null: off. Frozen at setup.
  context_notice_at: 0.7
  # 2.3: a USD profile's max_input_tokens per coder model. Heuristic counts run above DeepSeek's billed input (ledger
  # of 14 runs: est/billed median 1.34-1.37, min 0.89, so counting is not changed): 60,000 is about 45,000 billed;
  # worst case per call $0.018 (60,000 x $0.15 x 2 peak / 1M), the attempt's USD reservation still binds. Sonnet keeps
  # the profile's 40,000.
  max_input_tokens_by_model: {"deepseek:deepseek-flash": 60000, "deepseek:deepseek-v4-pro": 60000}
  # docs/reviews/SPEC_AGENT_OUTPUT_BUDGET.md: a USD profile's max_output_tokens per coder model. DeepSeek thinking shares the
  # reply budget with its reasoning: at 8,192 (chosen for Sonnet without thinking) the SWE v0 batch 2 agent spent 7,858 and
  # 8,192 on reasoning and was cut before any tool call. 32,000 output is at worst $0.0384 a call (peak); every call is still
  # refused before sending when its worst case does not fit the attempt's USD reservation. Token profiles and Sonnet keep 8,192.
  max_output_tokens_by_model: {"deepseek:deepseek-flash": 32000, "deepseek:deepseek-v4-pro": 32000}
  # Budget profiles (M6 W5): a contract may name one ("budget_profile": "large"). A profile sets only the attempt
  # reservation and the coder's output cap; it never changes the cost cap, which stays min(budget.max_usd, the
  # contract's limits.max_usd). At the default $0.50, `large` (45,000 tokens = $0.45 at $10/M output) leaves room
  # for practically one attempt; a higher cap is a per-run config approved in a preflight, never implied by a
  # profile. `default` is what a contract without a profile gets (kept equal to the values above by a test).
  profiles:
    default: {attempt_tokens: 30000, max_output_tokens: 4096}
    large: {attempt_tokens: 45000, max_output_tokens: 8192}
    # D1 (docs/reviews/DESIGN_ATTEMPT_USD.md): the attempt is reserved in USD, not as tokens priced as output. Each call
    # is still refused before sending when its worst case does not fit the USD left; max_input_tokens caps the input
    # of one call (refused: input_limit, the attempt ends context_limit). attempt_tokens is only a safety ceiling:
    # 400,000 tokens cost at least $0.80 at Sonnet's input price, so the USD limit binds first. It needs
    # budget.max_tokens >= 400,000 (a pilot config sets 1,200,000); with the 200,000 above it never starts.
    large_usd: {attempt_tokens: 400000, attempt_usd: 0.45, max_input_tokens: 40000, max_output_tokens: 8192}

# W2b (docs/reviews/SPEC_W2B_DRAFTER.md): the drafter reads an intake (read-only) and submits a W2a task draft; it never
# approves one (scripts/approve_draft.py, a human). Its one attempt is reserved in USD like large_usd (K6), capped by
# min(budget.max_usd, the run's --max-usd); attempt_tokens is only a ceiling and is kept within budget.max_tokens.
# Every SubmitDraft runs the draft's static checks and the baseline in the sandbox; max_submits bounds those runs.
drafter:
  role: drafter
  attempt_tokens: 200000
  # 0.70 and 64,000 since pilot w2b1d2 (Atha 2026-10-22): a corrected submit after a rejected one carries the first
  # draft in its input (~45,000) and needs ~12,700 output; at 0.45 / 40,000 it was refused before sending. The default
  # budget.max_usd (0.50) still caps a run below this; a pilot raises the cap in its own config.
  attempt_usd: 0.70
  # 200,000 since the first DeepSeek drafter run (2026-10-23): it read 13 files and hit 64,000 before any submit.
  # DeepSeek's context is 1M and a cached input token costs $0.003/M, so one call of 200,000 is ~$0.03 at worst.
  max_input_tokens: 200000
  # docs/reviews/SPEC_AGENT_BUDGET_GAPS.md 2.2: the drafter's output cap per model. SWE v0 batch 3 (21612 d1): DeepSeek's
  # reasoning used 16,384 of 16,384 and the drafter ended NO_DRAFT before a submit. 32,000 as the coder (#200); every call
  # is still lowered to what fits the attempt's $0.70 reservation.
  max_output_tokens_by_model: {"deepseek:deepseek-flash": 32000, "deepseek:deepseek-v4-pro": 32000}
  # 24 since SPEC_DRAFTER_SKIPPED_STEPS (2026-10-27): the 21379 re-run's drafters read 13 steps on sympy before a first
  # submit and ran out at 16 with one problem left, twice. The money bound is unchanged (attempt_usd, the stage cap).
  max_steps: 24
  max_submits: 5            # 3 until pilot w2b2d2 ran out on small slips (2026-10-23)
  # Before a passing draft is accepted, it is shown why each required test fails now and asked once whether each is the
  # behaviour the issue asks for (pilots 021 t1 and prompt_injection_v0 V4: a test failing on its own data was padded
  # around by the agent). Shares the one question with the scope question; a held draft is accepted if never answered.
  red_question: true
  # The profiles a draft may give the agent. Not `large` (45,000 tokens per attempt): an agent's input is re-sent at
  # every step, and in router pilot #1 reading a 23 KB file used it up before any edit (2026-10-23).
  agent_profiles: [default, large_usd]
  environment: argus       # the sandbox environment of every drafted validation (K4: python -m pytest <paths> only)
  validation_timeout_s: 300

# Router v0 (docs/reviews/SPEC_ROUTER_V0.md): `argus code` runs a code task as one job with one cap. job_max_usd: from the
# W2b ledger (worst drafter run $0.29 + one `large` agent attempt $0.45 = $0.74, room for one median redraft). Each stage
# is capped by what is left of the job, recorded when it starts. overrides: applied to every stage's config (the setup
# the W2b pilots ran with); shown before each live stage.
# SPEC_RESEARCH_STAGE: the research stage r1 (argus code --research). Read-only tools and ReadDocs; SubmitHandoff is
# checked by the harness (every url downloaded in the run, every quote in its page, the installed version).
research:
  role: researcher
  attempt_tokens: 400000
  attempt_usd: 0.25
  max_input_tokens: 100000
  max_output_tokens_by_model: {"deepseek:deepseek-flash": 16000, "deepseek:deepseek-v4-pro": 16000}
  max_steps: 20
  max_submits: 3

# SPEC_RESEARCH_JOB §7-8: paid DeepSeek Search/Fetch requests (harness/paid.py), in the same ledger and job cap as the
# model calls. Prices from https://api-docs.deepseek.com/quick_start/pricing (2026-11-03): per successful request.
web_research:
  provider: deepseek          # its api_key_env (providers.deepseek) is the key; it reaches only the child process, on stdin
  price_usd_per_request: {search: 0.00075, fetch: 0.00075}
  timeout_s: 30
  max_response_bytes: 4000000

# SPEC_RESEARCH_JOB: argus research. Every stage on the researcher role (deepseek-flash, Atha 2026-11-03); the job cap
# and each stage's cap (a stage the job's remainder cannot fund is not started). Workers' web requests are paid from their stage's reservation.
research_job:
  role: researcher
  # SPEC_GATEWAY_PROVIDER PR 2: the models of each stage, chosen per job (argus research --profile NAME). "free" uses
  # free OpenRouter models (Atha 2026-11-04: free first) on roles with no repository tools; the web stays DeepSeek.
  profile: deepseek
  profiles:
    deepseek: {planner: researcher, worker: researcher, synthesis: researcher, checker: researcher}
    free: {planner: free_planner, worker: free_worker, synthesis: free_planner, checker: free_checker}
    deepinfra: {planner: or_deepseek, worker: or_deepseek, synthesis: or_deepseek, checker: or_deepseek_checker}
  max_usd: 1.00
  max_output_tokens_by_model: {"deepseek:deepseek-flash": 16000, "deepseek:deepseek-v4-pro": 16000,
                               "openrouter:nvidia/nemotron-3-ultra-550b-a55b:free": 16000,
                               "openrouter:nvidia/nemotron-3.5-super-vl:free": 16000,
                               "openrouter:nvidia/nemotron-3.5-lightning:free": 16000,
                               "openrouter:deepseek/deepseek-v4.1-flash": 16000}
  planner: {cap_usd: 0.05, attempt_tokens: 100000, max_input_tokens: 30000, max_steps: 4, max_submits: 3,
            max_sub_questions: 4}
  worker: {cap_usd: 0.15, attempt_tokens: 600000, max_input_tokens: 60000, max_steps: 16, max_submits: 3,
           max_searches: 6, max_fetches: 8, search_count: 8, attempt_text: 48000, part_chars: 12000}
  # PR C: s1 writes the report from the findings, e1 flags each item (v0: flags only). No web, one Submit tool each.
  synthesis: {cap_usd: 0.15, attempt_tokens: 250000, max_input_tokens: 40000, max_steps: 4, max_submits: 3}
  checker: {cap_usd: 0.10, attempt_tokens: 200000, max_input_tokens: 40000, max_steps: 4, max_submits: 3,
            max_output_tokens_by_model: {"openrouter:deepseek/deepseek-v4.1-flash": 32000}}

# SPEC_JUDGE: argus judge <job> reads the issue, the approved draft and the review package and says PASS or BLOCK
# (advice only). max_input_chars: a larger prompt ends the stage NOT_JUDGED before any request. 120,000 characters are
# ~48,000 tokens by the heuristic count (chars/3 x 1.2); max_input_tokens leaves room for a rejected submit's reply
# (16,000 output) and the gate's feedback on the next step, so all max_submits can be used.
code_judge: {role: code_judge, cap_usd: 0.30, attempt_tokens: 400000, max_input_tokens: 100000, max_steps: 4,
             max_submits: 3, max_input_chars: 120000}   # not `judge:` (the rubric judge's, above)

router:
  job_max_usd: 1.00
  draft_max_usd: 0.75
  research_max_usd: 0.30   # SPEC_RESEARCH_STAGE r1, one stage (Atha 2026-10-29)
  judge_max_usd: 0.30      # SPEC_JUDGE J6: one judge stage, advice only (Atha 2026-11-05); 0.30 at the GLM list price,
                           # one 32k-output step reserves ~$0.16 with a 15k-token prompt, ~$0.28 at max_input_tokens
                           # (Atha 2026-11-07)
  agent_max_usd: {default: 0.50, large_usd: 0.75}   # by the profile the drafter chose (drafter.agent_profiles)
  overrides:
    budget.max_tokens: 3000000         # 1,200,000 until router pilot #1 on DeepSeek: tokens re-sent at every step
    drafter.attempt_tokens: 2000000    # (cache hits included) ran out at $0.018 of $0.70; the USD caps bind
    code_task.auto_validate: true
    code_task.max_steps: 30            # 12 ended sympy-24562 and -21379 (SWE v0 batches 3-4) before any write; USD caps bind
    # SPEC_ESTIMATE_REASONING: the heuristic counter did not count the reasoning_content sent back to DeepSeek, so calls
    # were billed up to 1.91x the estimate even at margin 2.5 (SPEC_HEURISTIC_INPUT_MARGIN's 2.5 covered that gap).
    # Counted, 2,006 DeepSeek calls bill at most 0.68x the estimate at 1.5 (Atha: 1.5). The input limits are the raw
    # tokens x 1.5: agent 100,000 and drafter ~166,000 raw, the context the uncounted reasoning already allowed (largest
    # billed 108,065 and 127,856); DeepSeek's context is above 393,216 (its max_tokens bound), so 100,000 + 32,000 fits.
    llm.input_margin_by_model: {"deepseek:deepseek-flash": 1.5, "deepseek:deepseek-v4-pro": 1.5}
    code_task.max_input_tokens_by_model: {"deepseek:deepseek-flash": 150000, "deepseek:deepseek-v4-pro": 150000}
    drafter.max_input_tokens: 250000
    # H2: large_usd's token ceiling bound before its USD (sympy-24562: 400,000 tokens at $0.036 of $0.45)
    code_task.profiles.large_usd.attempt_tokens: 1200000
    drafter.validation_timeout_s: 120  # the drafted validations' timeout; 261 router validations: p99 59 s, max 66 s; a hang cost 300 s each
    llm.prompt_cache.enabled: true

retry:
  attempts: 3
  base_delay: 0.05       # seconds, doubles each attempt

# Tool allowlist per role (enforced by the harness, not by prompts)
tools:
  orchestrator: [write_file]
  worker: [read_data, run_python]
  evaluator: []
  coder: [list_files, read_file, write_file, run_validation]   # code tasks (codetask/); Finish is not gated
  drafter: [list_files, search_files, read_file]   # W2b; read-only. SubmitDraft is not gated (it ends the run, as Finish)
  researcher: [list_files, search_files, read_file, read_docs]   # SPEC_RESEARCH_STAGE r1: never a tool that writes or runs

# ReadDocs (docs/reviews/SPEC_WEB_TOOLS.md): documentation pages for the coder, granted only by the human at approve
# (argus approve --web) and only for jobs whose validations all run in one of `environments` (never the SWE images).
# Hosts are exact names (no subdomains), each with a full-match path pattern. The download runs in a child process with
# no environment; the sandbox keeps --network none. Changing this block is a strict-lane PR.
web:
  environments: [argus, ledger_py312]
  hosts:
    docs.python.org: '/3(\.\d+)?/[A-Za-z0-9._~/-]*'
    pypi.org: '/pypi/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)?/json'
    docs.pytest.org: '/en/[A-Za-z0-9._~/-]*'
    fastapi.tiangolo.com: '/[A-Za-z0-9._~/-]*'
    starlette.dev: '/[A-Za-z0-9._~/-]*'   # was www.starlette.io, which stopped resolving (2026-10-28)
    docs.pydantic.dev: '/[A-Za-z0-9._~/-]*'
    www.python-httpx.org: '/[A-Za-z0-9._~/-]*'
    docs.sympy.org: '/[A-Za-z0-9._~/-]*'
  limits:
    part_chars: 12000          # one part of a page's text (READ_WHOLE_MAX of ReadFile)
    pages_attempt: 8           # different pages read in one attempt
    pages_run: 20              # pages downloaded in one run (an agent stage)
    page_bytes: 2000000        # one page, all of it or nothing
    attempt_bytes: 8000000     # downloaded in one attempt, reserved a page at a time (page_bytes)
    run_bytes: 20000000
    attempt_text: 60000        # web text given to one attempt
    timeout_s: 15              # one page with its redirects
    redirects: 3
    url_len: 300
    page_text: 400000          # the text of one page

# ---------------------------------------------------------------------------
# LLM providers. Adding a provider = adding an entry here.
# kind: anthropic | openai | deepseek | openai_compatible (any OpenAI-style API, no code needed)
# API keys are read from the environment variable named in api_key_env; never put keys in this file.
# ---------------------------------------------------------------------------
providers:
  anthropic:
    kind: anthropic
    api_key_env: ANTHROPIC_API_KEY
  openai:
    kind: openai
    api_key_env: OPENAI_API_KEY
  deepseek:
    kind: deepseek
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
  fake:                  # scripted model for tests and offline demos (no network, no key)
    kind: fake
    script_env: ARGUS_FAKE_SCRIPT
  # SPEC_GATEWAY_PROVIDER: one key for many models. Only models in gateway_models (below), each pinned to its upstream
  # providers with no fallback; the charge is the larger of our count and the gateway's reported usage.cost.
  openrouter:
    kind: gateway
    vendor: openrouter
    api_key_env: OPENROUTER_API_KEY
    key_prefix: sk-or-v1-
    base_url: https://openrouter.ai/api/v1
  # Example: uncomment to add another provider without touching any code
  # together:
  #   kind: openai_compatible
  #   api_key_env: TOGETHER_API_KEY
  #   base_url: https://api.together.xyz/v1

# ---------------------------------------------------------------------------
# Roles: which model plays which role. Swap a model by editing "model" below,
# or per run:  python main.py --model worker=deepseek:deepseek-flash
# max_output_tokens: upper bound per request (the wrapper may set it lower to stay in budget).
# timeout_s: per-request timeout. params: passed straight to the provider's chat class (temperature, ...).
# ---------------------------------------------------------------------------
roles:
  coder:
    # General tasks, slice 1 (codetask/). The model for a live run is chosen in its approval; tests use fake:scripted.
    # DeepSeek V4.1 Flash since 2026-10-23 (Atha), thinking mode since router pilot #2 (Atha: "mode thinking semua"):
    # with tools DeepSeek requires every earlier reasoning_content back (HTTP 400 otherwise); models/registry.py sends
    # it and the step memo keeps it (PR #168).
    model: "deepseek:deepseek-flash"
    max_output_tokens: 4096
    timeout_s: 120
    params: {extra_body: {thinking: {type: enabled}}}
  drafter:
    # W2b task drafts (codetask/drafter.py). One SubmitDraft holds the plan, the contract and every new test, plus the
    # model's thinking (on by default): in pilot w2b1d1 it hit 8,192 with 6,108 of them thinking, before any test was
    # written. 16,384 since then (option A, Atha 2026-10-22); the attempt's USD reservation still bounds every call.
    # DeepSeek V4.1 Flash, thinking mode (as coder). Pilot #2: 1 drafter run instead of 3, at about the same cost.
    model: "deepseek:deepseek-flash"
    max_output_tokens: 16384
    timeout_s: 180
    params: {extra_body: {thinking: {type: enabled}}}
  researcher:
    # SPEC_RESEARCH_STAGE r1: the drafter's model and thinking mode; its output cap per model is research.max_output_tokens_by_model.
    model: "deepseek:deepseek-flash"
    max_output_tokens: 16000
    timeout_s: 180
    params: {extra_body: {thinking: {type: enabled}}}
  # SPEC_GATEWAY_PROVIDER PR 2: the research job's free profile (no tools of their own; never a repository) and the
  # same DeepSeek V4.1 Flash through OpenRouter, pinned to DeepInfra (DeepSeek itself does not serve it there).
  # fallback_models: free models only, tried in order when the one before was rate limited (HTTP 429) before the
  # stage's first reply; the model in use is kept for a resume (Atha 2026-11-04).
  free_planner:
    model: "openrouter:nvidia/nemotron-3-ultra-550b-a55b:free"
    fallback_models: ["openrouter:nvidia/nemotron-3.5-super-vl:free"]
    max_output_tokens: 16000
    timeout_s: 180
  free_worker:
    model: "openrouter:nvidia/nemotron-3.5-super-vl:free"
    fallback_models: ["openrouter:nvidia/nemotron-3-ultra-550b-a55b:free"]
    max_output_tokens: 16000
    timeout_s: 180
  free_checker:
    # Eval v0 (2026-11-04): both Gemma 4 free models answered HTTP 429 in all 6 jobs; Atha: another model instead.
    model: "openrouter:nvidia/nemotron-3-ultra-550b-a55b:free"
    fallback_models: ["openrouter:nvidia/nemotron-3.5-super-vl:free", "openrouter:nvidia/nemotron-3.5-lightning:free"]
    max_output_tokens: 16000
    timeout_s: 180
  or_deepseek:
    model: "openrouter:deepseek/deepseek-v4.1-flash"
    max_output_tokens: 16000
    timeout_s: 180
  or_deepseek_checker:
    # Eval v0 (2026-11-04): e1 spent its whole 16,000-token output on reasoning in 6 of 8 jobs (stop: length, no
    # SubmitCheck). reasoning.max_tokens 6000 was not enforced (rerun: 15,519 reasoning tokens), so e1 gets 32,000
    # output instead (research_job.checker, Atha 2026-11-04); at ~75 tokens/s that is ~7 minutes, hence the timeout.
    model: "openrouter:deepseek/deepseek-v4.1-flash"
    max_output_tokens: 32000
    timeout_s: 480
    # pilots/e1_effort_v0 (2026-11-06, Atha "Ok gas"): effort low matched the graded reference 30/30 with ~40-50% less
    # reasoning, about half the cost and time (honoured only in part: 12,493 reasoning tokens on report A).
    params: {extra_body: {reasoning: {effort: low}}}
  code_judge:
    # SPEC_JUDGE J7 (Atha 2026-11-05): GLM-5.3, another family than the drafter's and the agent's DeepSeek, through
    # OpenRouter pinned to Baidu fp8 (gateway_models). No fallback: a failed provider ends the stage NOT_JUDGED.
    model: "openrouter:z-ai/glm-5.3"
    # Replay 2026-11-05: 4/11 calls spent all 16000 output tokens on reasoning (~187 s) and never submitted.
    max_output_tokens: 32000
    timeout_s: 480
  orchestrator:
    model: "anthropic:claude-sonnet-5-5"
    max_output_tokens: 2048
    timeout_s: 60
  worker:
    model: "anthropic:claude-haiku-5-5"
    max_output_tokens: 2048
    timeout_s: 60
    max_steps: 6           # model calls per worker run (impl.worker: llm)
  writer:
    # Phase 3b: writes the recommendations (impl.synthesize: llm). Decision M3-2: Sonnet 5.5.
    model: "anthropic:claude-sonnet-5-5"
    max_output_tokens: 2048
    timeout_s: 60
  evaluator:
    # Phase 3c judge (impl.evaluator: llm). Decision M3-1: DeepSeek V4.1 Flash, a different provider from the
    # writer. Thinking is on by default and counts as output, hence the larger output cap. No forced tool_choice.
    model: "deepseek:deepseek-flash"
    # 8192 since calibration run #1 (2026-10-14): output incl. thinking was median 1,216, p95 3,419, and one
    # judgement hit the old 4096 cap exactly and was cut off (approved by Atha + GPT, 2026-10-15).
    max_output_tokens: 8192
    timeout_s: 90

# ---------------------------------------------------------------------------
# Price catalog, USD per 1M tokens, from public pages checked mid-Oct 2026. Verify before relying on them.
# A missing entry (e.g. OpenAI below) means cost is reported as "n/a" instead of a guess.
# cache_read is the discounted rate for cached input tokens; without it cached tokens are billed as normal input.
# cache_write_5m / cache_write_1h: writes to the prompt cache (D5, docs/reviews/SPEC_D5_prompt_caching.md). Without a
# write rate a write has no known cost (null); caching an Anthropic model without cache_write_5m is a ConfigError.
# ---------------------------------------------------------------------------
# Anthropic prices, cache reads and writes checked 2026-10-22 on Anthropic's pricing page
# (platform.claude.com/docs/en/about-claude/pricing): reads are 0.05x input on Opus 5.5 and Sonnet 5.5 (Sonnet was
# wrongly 0.20 here), 0.1x on Haiku 5.5; writes 1.25x (5 minutes) and 2x (1 hour).
# Haiku 5.5 bills $0.50/$2.50 for prompts over 100K tokens; that tier is not modelled, which is safe only
# while every node's token estimate stays far below 100K (a reservation then cannot fit such a prompt).
prices:
  "anthropic:claude-haiku-5-5":  {input: 0.10, output: 0.50, cache_read: 0.01, cache_write_5m: 0.125, cache_write_1h: 0.20,
                                  long_context_above: 100000}   # x5 on every rate above it (not modelled: refused)
  "anthropic:claude-sonnet-5-5": {input: 2.00, output: 10.00, cache_read: 0.10, cache_write_5m: 2.50, cache_write_1h: 4.00}
  "anthropic:claude-opus-5-5":   {input: 4.00, output: 20.00, cache_read: 0.20, cache_write_5m: 5.00, cache_write_1h: 8.00}
  # DeepSeek checked 2026-10-23 on api-docs.deepseek.com/quick_start/pricing: deepseek-flash = DeepSeek-V4.1-Flash-1017;
  # off-peak input $0.15, cache hit $0.003, output $0.60; peak x2 (cache hits too). Caching is automatic, no write cost.
  "deepseek:deepseek-flash":     {input: 0.15, output: 0.60, cache_read: 0.003, peak_multiplier: 2}
  "deepseek:deepseek-v4-pro":    {input: 0.66, output: 1.98, cache_read: 0.022, peak_multiplier: 2}
  "fake:scripted":               {input: 1.00, output: 5.00, cache_read: 0.10, cache_write_5m: 1.25, cache_write_1h: 2.00}
                                 # made-up prices so tests exercise USD limits
  # SPEC_GATEWAY_PROVIDER PR 2, checked 2026-11-04 on openrouter.ai/api/v1/models/<id>/endpoints. Free models: 0 (their
  # gateway_models entry says free). DeepSeek V4.1 Flash on DeepInfra fp8; no peak window there.
  "openrouter:nvidia/nemotron-3-ultra-550b-a55b:free": {input: 0, output: 0}
  "openrouter:nvidia/nemotron-3.5-super-vl:free":          {input: 0, output: 0}
  "openrouter:nvidia/nemotron-3.5-lightning:free":     {input: 0, output: 0}
  # SPEC_GATEWAY_PROVIDER §4.1 (Atha 2026-11-07): a paid gateway model's price is the highest LIST price among its pinned
  # upstreams, never a discounted one, and every request sends it as max_price: an upstream whose discount ends cannot
  # serve above the price a reservation was made at (Baidu's 80% off GLM-5.3 ended 2026-11-06/07: billed 5x this file's
  # price). The ledger keeps the larger of this count and the gateway's usage.cost, so a discounted upstream is recorded
  # at up to the list price: an upper bound (Atha: "Ledger = batas atas"); usd_reported_nano keeps the real bill.
  # Checked 2026-11-07 on openrouter.ai/api/v1/models/<id>/endpoints. DeepInfra fp8: $0.14/$0.42 at 30% off.
  "openrouter:deepseek/deepseek-v4.1-flash":           {input: 0.20, output: 0.60, cache_read: 0.006}
  # GLM-5.3 list (Z.AI, Baidu now, Tenstorrent below it): $1.40/$4.40; Novita fp8 $0.63/$1.98 at 55% off, Tenstorrent fp8
  # $0.60/$2.50 undiscounted. The reservation is on a heuristic token count, not GLM's tokenizer: not an absolute bound.
  "openrouter:z-ai/glm-5.3":                           {input: 1.40, output: 4.40, cache_read: 0.26}

# SPEC_GATEWAY_PROVIDER: the models a gateway may serve, each pinned to upstream provider slugs (no fallback), and
# whether it is free (then only for gateway.free_roles, never a role that reads repositories). Each needs a price above
# (a free one: input 0, output 0). Filled after the smoke run (Atha 2026-11-04: DeepSeek, Gemini Flash, one :free).
# Checked 2026-11-04 on openrouter.ai/api/v1/models/<id>/endpoints: each free model has one endpoint, its own maker.
gateway_models:
  "openrouter:nvidia/nemotron-3-ultra-550b-a55b:free": {upstream: [nvidia], free: true}
  "openrouter:nvidia/nemotron-3.5-super-vl:free":          {upstream: [nvidia], free: true}
  "openrouter:nvidia/nemotron-3.5-lightning:free":     {upstream: [nvidia], free: true}
  # Atha 2026-11-07: Morph fp8 behind DeepInfra, used only when DeepInfra does not serve (pilots/e1_morph_v0: e1 55/60
  # vs the reference, mostly lenient, so not first). Its $0.022/$0.40 is under the list price sent as max_price.
  "openrouter:deepseek/deepseek-v4.1-flash":           {upstream: [deepinfra/fp8, morph/fp8]}
  # Atha 2026-11-07: Novita first (cheapest, 55% off), Tenstorrent (cheap, undiscounted), Baidu last (judge J8/J9 and
  # the planted-defect test ran on it). All fp8; order = only, so no other upstream; max_price bounds each.
  "openrouter:z-ai/glm-5.3":                           {upstream: [novita/fp8, tenstorrent/fp8, baidu/fp8]}
gateway:
  free_roles: [free_planner, free_worker, free_checker]   # Atha 2026-11-04 (research_free, split per stage)
  cost_drift_warn: 0.10         # price_drift when the gateway's cost and ours differ by more than this share

# DeepSeek charges double during these UTC windows on weekdays (Chinese public holidays are off-peak;
# that exception is not modelled here). 01-04 and 06-10 UTC = 08-11 and 13-17 WIB.
peak_windows:
  deepseek:
    utc_hours: [[1, 4], [6, 10]]
    weekdays_only: true

# Live smoke run: scripts/smoke_live.py, only with ARGUS_LIVE=1. Real money, so: one run, never retried,
# budget.max_usd lowered to max_usd if it is higher, workers one at a time.
smoke:
  max_usd: 0.50
  max_concurrency: 1

# Phase 3d: judge calibration (scripts/calibrate_judge.py, docs/MILESTONE3_PLAN.md 3.4). Locked before any live run
# (decision M3-3); tests/test_calibration.py fails if these change. Detection uses semantic detection (both
# judgements valid and rejecting); false rejects use operational rejection (any judgement that does not pass).
calibration:
  max_usd: 1.00          # hard cap for the whole run: each judgement starts only if billed + its worst case fits
  judgements: 2
  thresholds:
    min_detection_rate: 0.80
    max_false_rejects: 1

# Reliability guards for live calibration (docs/reviews/DESIGN_503.md, options 1 and 2; approved by GPT 2026-10-15).
# Separate from `calibration` so the locked thresholds stay untouched. Neither loosens a budget rule.
calibration_guard:
  refuse_peak: true                  # a live run does not start in the judge provider's peak window (--allow-peak skips
                                     # only this check; the cost cap and the breaker still apply)
  breaker_consecutive_transient: 4   # stop the run after this many transient errors in a row: "incomplete: provider
                                     # unavailable", never a pass and never a judge failure

# Code execution for LLM workers (RunPython). kind: docker | none. With none, workers get no RunPython.
# The image must be pinned (name@sha256:... or sha256:<image id>); scripts/pin_sandbox_image.sh does it
# on the VM. ARGUS_SANDBOX_IMAGE overrides `image`. There is never an unsandboxed fallback.
sandbox:
  kind: none
  image: null
  memory: 512m           # hard limit, swap disabled; exceeding it kills the code (exit 137)
  cpus: "1"
  pids: 128
  tmpfs_size: 64m
  timeout_s: 60          # wall clock; the container is killed and removed on timeout
  max_output_bytes: 65536            # kept per stream; the rest is drained and discarded (never buffered)
  kill_after_output_bytes: 16777216  # total output after which the container is killed early
  cleanup_timeout_s: 15              # total budget for kill/remove after a timeout; failure is logged
  allow_unpinned: false
  # Named environments (M6 W1): a contract's validation may name one ("environment": "argus") to run in its image
  # instead of the default one, with the same isolation flags. An unknown name blocks the run before any model call.
  # The image is set by its build script (git-ignored file) and ARGUS_SANDBOX_IMAGE_<NAME>; never by
  # ARGUS_SANDBOX_IMAGE.
  environments:
    # sympy (docs/reviews/SPEC_SWE_PILOT.md): python + mpmath and pytest, for SWE-bench style pilots on sympy; built by
    # scripts/build_env_sandbox_image.sh sympy <venv> -> .sandbox_image_sympy. No image: refused (never another one).
    sympy:
      image: null
    # sympy_py39 (docs/reviews/SPEC_ENV_FROM_PYTHON_IMAGE.md): Python 3.9 from an official image pinned by digest,
    # defined in environments/sympy_py39/, built by scripts/build_env_from_base.sh, usable by a job or the grader only
    # after scripts/check_env_image.py has passed for that exact image id.
    sympy_py39:
      image: null
    # ledger_py312: Python 3.12 + FastAPI, httpx and pytest for the argus-ledger practice app (PENDING.md, stage 2);
    # defined in environments/ledger_py312/, built and checked like sympy_py39.
    ledger_py312:
      image: null
    # ledger_staging (docs/reviews/SPEC_STAGING_V0.md S1): ledger_py312 plus uvicorn, the runtime image of the staging
    # container; built and checked like ledger_py312. Never in web.environments.
    ledger_staging:
      image: null
    # ledger_py312_up1 / ledger_staging_up1 (docs/reviews/SPEC_DEP_UPGRADE_V0.md U1): upgrade 1 (fastapi 0.143.2, httpx2
    # instead of httpx); built and checked like ledger_py312. The staging runtime is paired with its sandbox environment in
    # router/stage.py (RUNTIMES). Never in web.environments.
    ledger_py312_up1:
      image: null
    ledger_staging_up1:
      image: null
    # ledger_py312_up2 / ledger_staging_up2 (SPEC_DEP_UPGRADE_V0 section 6.1): upgrade 2 (fastapi 0.162.0, starlette 1.10.0);
    # built and checked like up1, paired in router/stage.py (RUNTIMES). Never in web.environments.
    ledger_py312_up2:
      image: null
    ledger_staging_up2:
      image: null
    # pwa_node22 (docs/reviews/SPEC_PWA_VIEWER.md E): Node 22 from its official image pinned by digest, with the exact
    # npm packages of its lock (sha512 each) in a read-only /node_modules; defined in environments/pwa_node22/, built by
    # scripts/build_env_node.sh, checked by scripts/check_env_image.py. Its validations run vitest, never pytest
    # (runner; an environment without one runs Python's). Never in web.environments.
    pwa_node22:
      image: null
      runner: vitest
      protected_required: true   # SPEC_PROTECTED_FILES K2: no job without .argus/protected in the commit
    argus:                 # Argus's own pinned dependencies (requirements.txt), built offline from a verified venv by
      image: null          # scripts/build_argus_sandbox_image.sh -> .sandbox_image_argus. No git, no bash, no Docker
